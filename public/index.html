<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>URL Shortener</h1>

            <p class="description">
                Shorten your long URLs into simple and easy-to-share links.
            </p>

            <div class="input-section">

                <input
                    type="text"
                    id="longUrl"
                    placeholder="Enter your long URL"
                >

                <button id="shortenBtn">
                    Shorten URL
                </button>

            </div>

            <button id="clearBtn" class="clear-btn">
                Clear
            </button>

            <div id="result"></div>

        </div>

    </div>

    <script src="/script.js"></script>

</body>
</html>
